name: Build & Release

# CI pipeline for every push / PR to main, plus tag-triggered release.
# Produces Linux (deb, AppImage, rpm) and Windows (msi, nsis) bundles
# and uploads SHA-256 checksums as build artifacts.
#
# The pipeline:
#   1. Install Rust 1.97.1 (pinned via rust-toolchain.toml) and Node 22.
#   2. Run `cargo fmt --check` and `cargo clippy -D warnings` as hard
#      gates — they MUST pass before any binary is produced.
#   3. Run `cargo test --lib` on Linux to ensure the unit suite passes.
#   4. Build the Vite frontend (npm run build) → dist/
#   5. Build the Tauri bundle for the current platform.
#   6. Generate SHA-256 checksums for every produced artifact.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libxdo-dev \
            tesseract-ocr \
            libayatana-appindicator3-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Install npm deps
        run: npm ci

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib --no-fail-fast

  build-linux:
    name: Build Linux (deb + AppImage)
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libxdo-dev \
            tesseract-ocr \
            libayatana-appindicator3-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aegis AI ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Generate checksums
        shell: bash
        run: |
          set -e
          mkdir -p checksums
          # The Tauri workspace Cargo.toml lives at the repo root, so the
          # build artifacts end up under `target/<target>/release/bundle/`,
          # not `src-tauri/target/...`. Walk both paths defensively in case
          # the layout changes in the future.
          for BUNDLE_DIR in \
              "target/x86_64-unknown-linux-gnu/release/bundle" \
              "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"; do
            if [ -d "$BUNDLE_DIR" ]; then
              find "$BUNDLE_DIR" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 | \
                while IFS= read -r -d '' f; do
                  base=$(basename "$f")
                  sha256sum "$f" > "checksums/${base}.sha256"
                done
            fi
          done
          if [ -z "$(ls -A checksums 2>/dev/null)" ]; then
            echo "::warning::No bundle directory found, no checksums generated."
          fi

      - name: Upload Linux checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-linux
          path: checksums/*.sha256
          if-no-files-found: warn

  build-windows:
    name: Build Windows (msi + nsis)
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aegis AI ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          # Look under both `target/...` and `src-tauri/target/...` — the
          # workspace Cargo.toml is at the repo root, so the canonical path
          # is `target/<target>/release/bundle`.
          foreach ($bundle in @(
              "target/x86_64-pc-windows-msvc/release/bundle",
              "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          )) {
            if (Test-Path $bundle) {
              Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe |
                ForEach-Object {
                  $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                  "$hash  $($_.Name)" | Out-File -FilePath "checksums/$($_.Name).sha256" -Encoding ascii
                }
            }
          }
          if (-not (Get-ChildItem checksums -ErrorAction SilentlyContinue)) {
            Write-Warning "No bundle directory found, no checksums generated."
          }

      - name: Upload Windows checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-windows
          path: checksums/*.sha256
          if-no-files-found: warn
