name: Build & Release

# CI pipeline for every push / PR to main, plus tag-triggered release.
# Produces Linux (deb, AppImage, rpm) and Windows (msi, nsis) bundles
# and uploads SHA-256 checksums as build artifacts.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libxdo-dev \
            tesseract-ocr \
            libayatana-appindicator3-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Install npm deps
        run: npm ci

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aegis AI ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Generate checksums
        shell: bash
        run: |
          set -e
          mkdir -p checksums
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 | \
              while IFS= read -r -d '' f; do
                base=$(basename "$f")
                sha256sum "$f" > "checksums/${base}.sha256"
              done
          else
            echo "::warning::No bundle directory found at $BUNDLE_DIR"
          fi

      - name: Upload Linux checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-linux
          path: checksums/*.sha256
          if-no-files-found: warn

  build-windows:
    name: Build Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aegis AI ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $bundle) {
            Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe |
              ForEach-Object {
                $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                "$hash  $($_.Name)" | Out-File -FilePath "checksums/$($_.Name).sha256" -Encoding ascii
              }
          } else {
            Write-Warning "No bundle directory found at $bundle"
          }

      - name: Upload Windows checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-windows
          path: checksums/*.sha256
          if-no-files-found: warn
