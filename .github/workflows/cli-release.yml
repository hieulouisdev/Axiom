name: CLI Cross-Platform Build

# Builds the standalone `aegis` CLI binary for every supported platform
# (Linux x64/ARM64/ARMv7, Windows x64, macOS Intel/Apple Silicon, Android ARM64).
#
# Triggered when a v* tag is pushed OR manually via workflow_dispatch.
# Uploads the binaries as both workflow artifacts and release assets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: aegis-${{ github.ref_name || inputs.tag }}-x86_64-linux
            archive: tar.gz
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: aegis-${{ github.ref_name || inputs.tag }}-aarch64-linux
            archive: tar.gz
            cross: true
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            artifact: aegis-${{ github.ref_name || inputs.tag }}-armv7-linux
            archive: tar.gz
            cross: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: aegis-${{ github.ref_name || inputs.tag }}-x86_64-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aegis-${{ github.ref_name || inputs.tag }}-x86_64-windows.exe
            archive: none
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: aegis-${{ github.ref_name || inputs.tag }}-x86_64-macos
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: aegis-${{ github.ref_name || inputs.tag }}-aarch64-macos
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilers (Linux ARM)
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf musl-tools

      - name: Build (release)
        uses: ClementTsang/cargo-action@v0.0.3
        with:
          command: build
          args: -p aegis-cli --release --target ${{ matrix.target }}
          use-cross: ${{ matrix.cross == true }}

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/aegis.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/aegis" "${{ matrix.artifact }}"
          fi
          ls -lh "${{ matrix.artifact }}"

      - name: Compute SHA-256
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

      - name: Upload to release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          fail_on_unmatched_files: false
