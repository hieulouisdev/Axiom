name: Release Build

# Triggered automatically when a NEW RELEASE is published on GitHub.
# Builds Windows (.msi, .exe NSIS) and Linux (.deb, .AppImage) bundles
# and attaches them to the release as assets.
#
# Manual dispatch is also supported (workflow_dispatch) so you can
# re-run the build for an existing release if the first attempt failed.
#
# Pipeline:
#   1. Install Rust 1.97.1 (matches rust-toolchain.toml) and Node 22.
#   2. Run `cargo fmt --check` and `cargo clippy -D warnings` as hard gates.
#   3. Run `cargo test --lib` to ensure unit tests pass before publishing.
#   4. Build the Vite frontend (npm run build) → dist/
#   5. Build the Tauri bundle for the current platform.
#   6. Compute SHA-256 checksums and upload them both as artifacts and as
#      release assets attached to the published release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.0.0)"
        required: true
        type: string

# Cancel any in-flight runs for the same release so we don't race to
# upload the same asset twice.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
            bundles: deb appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
            bundles: msi nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ matrix.label }}-
            cargo-

      - name: Install Linux system deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libxdo-dev \
            tesseract-ocr \
            libayatana-appindicator3-dev
          # `libayatana-appindicator3-dev` provides the system-tray library
          # that Tauri 2.0's tray-icon feature requires on Linux. Without it,
          # the Tauri CLI panics with "Can't detect any appindicator library"
          # at the bundling step.

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test (Linux only — needs GTK to link)
        if: matrix.label == 'linux'
        working-directory: src-tauri
        run: cargo test --lib --no-fail-fast

      - name: Build frontend
        id: frontend
        run: npm run build

      - name: Determine release tag
        id: reltag
        if: always()
        shell: bash
        run: |
          # Prefer the release event's tag, fall back to workflow_dispatch input.
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found (neither release event nor workflow_dispatch input)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build & upload Tauri bundle to the release
        id: tauri
        if: success() || steps.frontend.outcome == 'success'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.reltag.outputs.tag }}
          releaseName: "Aegis AI ${{ steps.reltag.outputs.tag }}"
          releaseBody: "See ROADMAP.md and CHANGELOG.md for release notes."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums (Linux)
        if: matrix.label == 'linux' && steps.tauri.outcome == 'success'
        shell: bash
        run: |
          set -e
          mkdir -p checksums
          # The Tauri workspace Cargo.toml lives at the repo root, so the
          # build artifacts end up under `target/<target>/release/bundle/`.
          # Walk both `target/...` and `src-tauri/target/...` defensively.
          for BUNDLE_DIR in \
              "target/${{ matrix.target }}/release/bundle" \
              "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$BUNDLE_DIR" ]; then
              find "$BUNDLE_DIR" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 | \
                while IFS= read -r -d '' f; do
                  base=$(basename "$f")
                  sha256sum "$f" > "checksums/${base}.sha256"
                done
            fi
          done
          ls -la checksums/ 2>/dev/null || echo "::warning::No checksums generated."

      - name: Generate SHA-256 checksums (Windows)
        if: matrix.label == 'windows' && steps.tauri.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          foreach ($bundle in @(
              "target/${{ matrix.target }}/release/bundle",
              "src-tauri/target/${{ matrix.target }}/release/bundle"
          )) {
            if (Test-Path $bundle) {
              Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe |
                ForEach-Object {
                  $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                  "$hash  $($_.Name)" | Out-File -FilePath "checksums/$($_.Name).sha256" -Encoding ascii
                }
            }
          }
          Get-ChildItem checksums -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem checksums -ErrorAction SilentlyContinue)) {
            Write-Warning "No checksums generated."
          }

      - name: Upload checksums to release
        if: always() && steps.tauri.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: |
            checksums/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build summary (${{ matrix.label }})"
            echo ""
            echo "- Target: \`${{ matrix.target }}\`"
            echo "- Bundles: \`${{ matrix.bundles }}\`"
            echo "- Release tag: \`${{ steps.reltag.outputs.tag }}\`"
            echo "- Frontend outcome: \`${{ steps.frontend.outcome }}\`"
            echo "- Tauri outcome: \`${{ steps.tauri.outcome }}\`"
            echo "- Rust: 1.97.1 (matches rust-toolchain.toml)"
            echo ""
            echo "Bundles produced under \`target/${{ matrix.target }}/release/bundle/\`:"
            echo ""
            echo '```'
            find target src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
