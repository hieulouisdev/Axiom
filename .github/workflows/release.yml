name: Release Build

# Triggered automatically when a NEW RELEASE is published on GitHub.
# Builds Windows (.msi, .exe NSIS) and Linux (.deb, .AppImage) bundles
# and attaches them to the release as assets.
#
# Manual dispatch is also supported (workflow_dispatch) so you can
# re-run the build for an existing release if the first attempt failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.5.0)"
        required: true
        type: string

# Cancel any in-flight runs for the same release so we don't race to
# upload the same asset twice.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
            bundles: deb appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
            bundles: msi nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.label }}-
            cargo-

      - name: Install Linux system deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libxdo-dev \
            tesseract-ocr

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Cargo fmt check (lint gate, informational)
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true # v0.5: informational; will be enforced in v0.6

      - name: Cargo clippy (lint gate, informational)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true # v0.5: informational; will be enforced in v0.6

      - name: Build frontend
        id: frontend
        run: npm run build

      - name: Determine release tag
        id: reltag
        if: always()
        shell: bash
        run: |
          # Prefer the release event's tag, fall back to workflow_dispatch input.
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No release tag found (neither release event nor workflow_dispatch input)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Build & upload Tauri bundle to the release
        id: tauri
        if: success() || steps.frontend.outcome == 'success'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.reltag.outputs.tag }}
          releaseName: "Aegis AI ${{ steps.reltag.outputs.tag }}"
          releaseBody: "See ROADMAP.md and CHANGELOG.md for release notes."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate SHA-256 checksums (Linux)
        if: matrix.label == 'linux' && steps.tauri.outcome == 'success'
        shell: bash
        run: |
          set -e
          mkdir -p checksums
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | \
              while IFS= read -r -d '' f; do
                base=$(basename "$f")
                sha256sum "$f" > "checksums/${base}.sha256"
              done
            ls -la checksums/
          else
            echo "::warning::No bundle directory found at $BUNDLE_DIR"
          fi

      - name: Generate SHA-256 checksums (Windows)
        if: matrix.label == 'windows' && steps.tauri.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path $bundle) {
            Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe |
              ForEach-Object {
                $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                "$hash  $($_.Name)" | Out-File -FilePath "checksums/$($_.Name).sha256" -Encoding ascii
              }
            Get-ChildItem checksums/
          } else {
            Write-Warning "No bundle directory found at $bundle"
          }

      - name: Upload checksums to release
        if: always() && steps.tauri.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: |
            checksums/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build summary (${{ matrix.label }})"
            echo ""
            echo "- Target: \`${{ matrix.target }}\`"
            echo "- Bundles: \`${{ matrix.bundles }}\`"
            echo "- Release tag: \`${{ steps.reltag.outputs.tag }}\`"
            echo "- Frontend outcome: \`${{ steps.frontend.outcome }}\`"
            echo "- Tauri outcome: \`${{ steps.tauri.outcome }}\`"
            echo "- Rust: 1.97.1 (matches rust-toolchain.toml)"
            echo ""
            echo "Bundles produced under \`src-tauri/target/${{ matrix.target }}/release/bundle/\`:"
            echo ""
            echo '```'
            find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) 2>/dev/null | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
