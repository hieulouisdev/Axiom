[package]
name = "aegis-ai"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Aegis AI — secure cross-platform AI assistant"
repository = { workspace = true }
homepage = { workspace = true }

[lib]
name = "aegis_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri 2
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.3"
tauri-plugin-store = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"

# Core async / serialization
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client for AI providers
reqwest = { workspace = true }

# Database for memory store
rusqlite = { workspace = true }

# Time / UUID / hashing
time = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Config
directories = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

# Misc
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
bytes = "1.12"
base64 = "0.23"
url = "2.5"

# Phase 2: GUI automation
enigo = "0.6"

# Phase 2: Screen capture
screenshots = "0.8"

# Phase 2: OCR
rusty-tesseract = "1.1"

# Phase 2: OS keychain for credential storage
keyring = "4"

# Phase 2: AWS SigV4 for Bedrock
aws-sigv4 = "1.5"
aws-credential-types = "1.2"

# Phase 2: File watcher
notify = "8"

# Phase 2: HTTP types for AWS SigV4
http = "1.5"

# v0.4: Regex for the regex_search tool + glob-to-regex conversion
regex = "1.13"

# Platform-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
# procfs is Linux-only — it doesn't build on Windows or macOS.
# Used by `security::monitor` (process enumeration) and `security::network`
# (listening-socket enumeration).
procfs = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
