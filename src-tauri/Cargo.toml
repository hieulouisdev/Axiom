[package]
name = "aegis-ai"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = "Aegis AI — secure cross-platform AI assistant"
repository = { workspace = true }
homepage = { workspace = true }

[lib]
name = "aegis_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri 2
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-process = "2.0"

# Core async / serialization
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client for AI providers
reqwest = { workspace = true }

# Database for memory store
rusqlite = { workspace = true }

# Time / UUID / hashing
time = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Config
directories = { workspace = true }
toml = { workspace = true }

# Misc
once_cell = "1.20"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
bytes = "1.9"
base64 = "0.22"
url = "2.5"

# Phase 2: GUI automation
enigo = "0.2"

# Phase 2: Screen capture
screenshots = "0.2"

# Phase 2: OCR
rusty-tesseract = "1.1"

# Phase 2: OS keychain for credential storage
keyring = "2"

# Phase 2: AWS SigV4 for Bedrock
aws-sigv4 = "1.2"
aws-credential-types = "1.2"

# Phase 2: File watcher
notify = "6"

# Phase 2: Process/network info
procfs = "0.16"

# Phase 2: HTTP types for AWS SigV4
http = "1.1"

# v0.4: Regex for the regex_search tool + glob-to-regex conversion
regex = "1.11"

# Platform-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
